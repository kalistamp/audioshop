[project]
name = "audioshop-extract"
version = "1.0.0"
description = "Turns links, documents and photos of pages into plain text for Audioshop."
requires-python = ">=3.11,<3.13"
dependencies = [
  "trafilatura>=2.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "rapidocr-onnxruntime>=1.4",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  # cv2 without GUI libraries (rapidocr asks for opencv-python, which needs libGL)
  "opencv-python-headless>=4.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
exclude-dependencies = ["opencv-python"]
# Supply-chain hygiene: never resolve a release younger than two weeks.
exclude-newer = "2026-09-24T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs OCR (a few seconds each)"]
